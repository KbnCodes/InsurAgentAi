
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: insurance-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: insurance_ai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - insurance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance -d insurance_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  insurance_pgdata:
